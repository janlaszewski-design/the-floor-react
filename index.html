ype": "text", "status": "ready", "questions": [{"q": "Założyciel Microsoftu", "a": "Bill Gates"}, {"q": "Twórca Tesli i SpaceX", "a": "Elon Musk"}, {"q": "Założyciel Amazona", "a": "Jeff Bezos"}, {"q": "Twórca Facebooka", "a": "Mark Zuckerberg"}, {"q": "Założyciel Apple z Wozniakiem", "a": "Steve Jobs"}, {"q": "Najbogatszy Polak, twórca Cyfrowego Polsatu", "a": "Zygmunt Solorz"}, {"q": "Inwestor zwany 'Wyrocznią z Omaha'", "a": "Warren Buffett"}]}], "DOM": [{"name": "SPRZĄTANIE", "type": "text", "status": "ready", "questions": [{"q": "Urządzenie zasysające kurz z dywanu", "a": "odkurzacz"}, {"q": "Drążek z włóknami do mycia podłogi", "a": "mop"}, {"q": "Sprzęt do zamiatania, zwykle z szufelką", "a": "miotła"}, {"q": "Środek do mycia naczyń", "a": "płyn do naczyń"}, {"q": "Ściereczka z mikrofibry służy do ...", "a": "wycierania kurzu / mycia"}, {"q": "Urządzenie-robot samodzielnie jeżdżące i odkurzające", "a": "robot sprzątający / iRobot"}]}, {"name": "SPRZĘTY DOMOWE", "type": "text", "status": "ready", "questions": [{"q": "Narzędzie do wbijania gwoździ", "a": "Młotek", "hint": "uderzenie"}, {"q": "Narzędzie do śrub", "a": "Śrubokręt", "hint": "obrót"}, {"q": "Narzędzie do cięcia drewna", "a": "Piła", "hint": "zęby"}, {"q": "Narzędzie do wiercenia", "a": "Wiertarka", "hint": "otwór"}, {"q": "Narzędzie do mierzenia długości", "a": "Miarka", "hint": "centymetry"}, {"q": "Klucz do nakrętek", "a": "Klucz", "hint": "mechanik"}, {"q": "Przybór do krojenia", "a": "Nóż", "hint": "ostry"}, {"q": "Naczynie do smażenia", "a": "Patelnia", "hint": "olej"}, {"q": "Naczynie do gotowania zupy", "a": "Garnek", "hint": "woda"}, {"q": "Przybór do nabierania zupy", "a": "Chochla", "hint": "warząchew"}, {"q": "Urządzenie do tostów", "a": "Toster", "hint": "grzanki"}, {"q": "Urządzenie do kawy", "a": "Ekspres", "hint": "espresso"}, {"q": "Urządzenie do miksowania", "a": "Blender", "hint": "koktajl"}, {"q": "Przybór do otwierania puszek", "a": "Otwieracz", "hint": "konserwa"}, {"q": "Czym ucieramy ser", "a": "Tarka", "hint": "drobno"}, {"q": "Czym wałkujemy ciasto", "a": "Wałek", "hint": "ciasto"}, {"q": "Naczynie do pieczenia ciasta", "a": "Forma", "hint": "piekarnik"}, {"q": "Sztuciec do zupy", "a": "Łyżka", "hint": "płynne"}, {"q": "Sztuciec do nakłuwania", "a": "Widelec", "hint": "zęby"}, {"q": "Czym zamiatamy podłogę", "a": "Miotła", "hint": "kurz"}]}]};
window.ROUND_SIZE=40; window.TIMER=45; window.SKIP_PENALTY=3;
</script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function normalize(s){return (s||'').toLowerCase().trim().replace(/[ąàâ]/g,'a').replace(/[ęèé]/g,'e').replace(/[óò]/g,'o').replace(/ł/g,'l').replace(/[śş]/g,'s').replace(/[żź]/g,'z').replace(/[ćç]/g,'c').replace(/ń/g,'n').replace(/\s+/g,' ').replace(/[.,!?]/g,'');}
function checkAnswer(u,c){if(!u||!c)return false;const a=normalize(u),b=normalize(c);if(a===b)return true;if(b.includes(a)&&a.length>=3)return true;if(a.includes(b))return true;return false;}

function App(){
  const S=window.S09;
  const domains=Object.keys(S).sort();
  const [screen,setScreen]=useState('menu');
  const [mode,setMode]=useState('solo'); // solo | bot | duo
  const [diff,setDiff]=useState('medium');
  const [domain,setDomain]=useState(domains[0]);
  const [cat,setCat]=useState(null);

  // licznik gotowych w dziedzinie
  const readyCount=d=>S[d].filter(s=>s.status==='ready').length;

  // runda
  const [deck,setDeck]=useState([]);
  const [pos,setPos]=useState(0);
  const [pt,setPt]=useState(window.TIMER);
  const [bt,setBt]=useState(window.TIMER);
  const [active,setActive]=useState('p1'); // p1 | p2(bot/human)
  const [ans,setAns]=useState('');
  const [fb,setFb]=useState({t:'',k:''});
  const [over,setOver]=useState(false);
  const [winner,setWinner]=useState(null);
  const [p1solved,setP1solved]=useState(0);
  const [p2solved,setP2solved]=useState(0);
  const [heard,setHeard]=useState('');
  const [listening,setListening]=useState(false);
  const timer=useRef(null); const botT=useRef(null); const rec=useRef(null);
  const micOK=typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition);

  function startRound(){
    const set=cat; if(!set||set.status!=='ready')return;
    // buduj talię: 40 pozycji, losowo z pytań (warianty)
    let pool=shuffle(set.questions);
    while(pool.length<window.ROUND_SIZE && set.questions.length>0) pool=pool.concat(shuffle(set.questions));
    setDeck(pool.slice(0,window.ROUND_SIZE));
    setPos(0);setPt(window.TIMER);setBt(window.TIMER);setActive('p1');setAns('');setFb({t:'',k:''});
    setOver(false);setWinner(null);setP1solved(0);setP2solved(0);setHeard('');
    setScreen('duel');
  }

  // zegar pojedynku (bot/duo): aktywny zegar tyka
  useEffect(()=>{
    if(screen!=='duel'||over)return;
    if(mode==='solo'){ // solo: tyka p1 do zera
      timer.current=setInterval(()=>{setPt(t=>{if(t<=1){clearInterval(timer.current);finish('solo');return 0;}return t-1;});},1000);
      return ()=>clearInterval(timer.current);
    }
    timer.current=setInterval(()=>{
      if(active==='p1'){setPt(t=>{if(t<=1){clearInterval(timer.current);finish('p2');return 0;}return t-1;});}
      else{setBt(t=>{if(t<=1){clearInterval(timer.current);finish('p1');return 0;}return t-1;});}
    },1000);
    return ()=>clearInterval(timer.current);
  },[screen,over,active,mode]);

  // BOT gra gdy jego tura
  useEffect(()=>{
    if(screen!=='duel'||over||mode!=='bot'||active!=='p2')return;
    const rt = diff==='easy'?4000+Math.random()*5000 : diff==='hard'?1000+Math.random()*2000 : 2500+Math.random()*3500;
    const chance = diff==='easy'?0.5:diff==='hard'?0.92:0.72;
    botT.current=setTimeout(()=>{
      if(Math.random()<chance){ setP2solved(s=>s+1); setFb({t:'🤖 Bot: '+deck[pos].a,k:'no'}); nextAfter('p1'); }
      else { setBt(t=>Math.max(0,t-window.SKIP_PENALTY)); setFb({t:'🤖 Bot pasuje',k:'skip'}); } // bot pasuje, próbuje dalej (zostaje jego tura) -> kolejne pytanie
      // jeśli bot pasuje, daj nowe pytanie ale tura zostaje
      if(Math.random()>=chance){ setTimeout(()=>{advance(); },400); }
    }, rt);
    return ()=>clearTimeout(botT.current);
  },[active,screen,over,mode,pos]);

  function advance(){ setPos(p=>(p+1)%deck.length); setAns(''); setHeard(''); }
  function nextAfter(next){ setTimeout(()=>{ setActive(next); advance(); setFb({t:'',k:''}); }, 800); }

  function submit(val){
    if(over)return;
    const cur=deck[pos];
    if(checkAnswer(val,cur.a)){
      if(active==='p1'){setP1solved(s=>s+1);} else {setP2solved(s=>s+1);}
      setFb({t:'✓ Dobrze!',k:'ok'});
      if(mode==='solo'){ advance(); setFb({t:'',k:''}); }
      else { nextAfter(active==='p1'?'p2':'p1'); }
    } else {
      setFb({t:'✗ Spróbuj jeszcze',k:'no'});
    }
    setAns('');
  }
  function skip(){
    if(over)return;
    if(mode==='solo'){ setPt(t=>Math.max(0,t-window.SKIP_PENALTY)); }
    else if(active==='p1'){ setPt(t=>Math.max(0,t-window.SKIP_PENALTY)); }
    else { setBt(t=>Math.max(0,t-window.SKIP_PENALTY)); }
    setFb({t:'⏭ Pas (−'+window.SKIP_PENALTY+'s)',k:'skip'}); setAns(''); advance();
  }
  function finish(w){ clearInterval(timer.current); clearTimeout(botT.current); setOver(true); setWinner(w); setScreen('result'); }

  function startMic(){
    if(!micOK)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new SR();
    r.lang='pl-PL';r.interimResults=false;r.maxAlternatives=3;
    r.onresult=e=>{let hit=false,best='';for(let i=0;i<e.results[0].length;i++){const tx=e.results[0][i].transcript;if(i===0)best=tx;if(checkAnswer(tx,deck[pos].a)){hit=true;break;}}setHeard(best);setListening(false);submit(hit?deck[pos].a:best);};
    r.onerror=()=>setListening(false);r.onend=()=>setListening(false);rec.current=r;setListening(true);setHeard('');try{r.start();}catch(e){}
  }

  // ====== MENU ======
  if(screen==='menu'){
    return (<div className="wrap">
      <div className="header"><h1>⚡ THE FLOOR · S09</h1><p>Trening pod teleturniej</p></div>
      <div className="card"><h2>Tryb</h2><div className="seg">
        <button className={"btn"+(mode==='solo'?' sel':'')} onClick={()=>setMode('solo')}>👤 Trening<br/><small style={{opacity:.8,fontWeight:400}}>solo, 45s</small></button>
        <button className={"btn"+(mode==='bot'?' sel':'')} onClick={()=>setMode('bot')}>🤖 vs Bot<br/><small style={{opacity:.8,fontWeight:400}}>pojedynek</small></button>
        <button className={"btn"+(mode==='duo'?' sel':'')} onClick={()=>setMode('duo')}>👥 2 graczy<br/><small style={{opacity:.8,fontWeight:400}}>pojedynek</small></button>
      </div>
      {mode==='bot'&&<div className="seg" style={{marginTop:8}}>
        {['easy','medium','hard'].map(d=><button key={d} className={"btn"+(diff===d?' sel':'')} onClick={()=>setDiff(d)}>{d==='easy'?'Łatwy':d==='medium'?'Średni':'Trudny'}</button>)}
      </div>}
      </div>
      <div className="card"><h2>Dziedzina</h2><div className="dom-grid">
        {domains.map(d=><div key={d} className={"dom-btn"+(domain===d?' sel':'')} onClick={()=>{setDomain(d);setCat(null);}}>{d}<div className="c">{readyCount(d)} gotowych</div></div>)}
      </div></div>
      <div className="card"><h2>Kategoria — {domain}</h2><div className="cat-list">
        {S[domain].map((s,i)=>{
          const ready=s.status==='ready';
          return <div key={i} className={"cat-row"+(cat===s?' sel':'')+(ready?'':' dis')} onClick={()=>ready&&setCat(s)}>
            <div><div className="nm">{s.name}</div>{s.subcat&&<div className="sub">{s.subcat}</div>}</div>
            <div className={"tag "+(s.type==='image'?'tag-img':s.type==='text'?'tag-txt':'tag-need')}>
              {s.type==='image'?('🖼 '+s.questions.length):s.type==='text'?('📝 '+s.questions.length):'⚠ zdjęcia'}</div>
          </div>;
        })}
      </div></div>
      <button className="btn btn-primary bigbtn" disabled={!cat} onClick={startRound}>{cat?('▶ Start: '+cat.name):'Wybierz kategorię'}</button>
      {micOK?<div className="hint">🎤 Możesz odpowiadać głosem</div>:<div className="hint">ℹ️ Mikrofon działa najlepiej w Chrome / na telefonie</div>}
      <div className="footer">The Floor S09 v6 · 39 kategorii gotowych · 1546 pytań · mechanika v7</div>
    </div>);
  }

  // ====== WYNIK ======
  if(screen==='result'){
    let txt='';
    if(mode==='solo') txt='Rozpoznane: '+p1solved;
    else if(winner==='p1') txt=(mode==='bot'?'Wygrałeś z botem! 🏆':'Wygrywa Gracz 1! 🏆');
    else txt=(mode==='bot'?'Bot wygrał 🤖':'Wygrywa Gracz 2! 🏆');
    return (<div className="wrap"><div className="header"><h1>⚡ Koniec</h1></div>
      <div className="card result"><div style={{color:'#9aa6d4'}}>{cat.name}</div>
        <div className="big">{mode==='solo'?p1solved:(p1solved+' : '+p2solved)}</div>
        <div style={{color:'#9aa6d4',fontSize:16}}>{txt}</div>
        <div className="row" style={{marginTop:20}}>
          <button className="btn btn-primary" onClick={startRound}>▶ Jeszcze raz</button>
          <button className="btn" onClick={()=>setScreen('menu')}>← Menu</button>
        </div>
      </div></div>);
  }

  // ====== POJEDYNEK / TRENING ======
  const cur=deck[pos]; if(!cur)return null;
  const isSvg = cur.img && cur.img.endsWith('.svg');
  const myTurn = mode==='solo' || active==='p1' || (mode==='duo'&&active==='p2');
  return (<div className="wrap">
    {mode==='solo'?(
      <div className="duel-top"><div className="clock active"><div className="nm">Czas</div><div className={"t"+(pt<=10?' low':'')}>{pt}s</div></div></div>
    ):(
      <div className="duel-top">
        <div className={"clock"+(active==='p1'?' active':'')+(pt<=10?' low':'')}><div className="nm">{mode==='bot'?'Ty':'Gracz 1'}</div><div className="t">{pt}s</div></div>
        <div className={"clock"+(active==='p2'?' active':'')+(bt<=10?' low':'')}><div className="nm">{mode==='bot'?'🤖 Bot':'Gracz 2'}</div><div className="t">{bt}s</div></div>
      </div>
    )}
    <div className="score"><span>{cat.name}</span><span>Pytanie {pos+1}</span></div>
    <div className="card">
      {cur.img?(
        <div className={"imgbox"+(isSvg?' svg':'')}><img src={cur.img} alt="?" onError={e=>{e.target.style.display='none';e.target.nextSibling.style.display='block';}}/><div className="ph" style={{display:'none'}}>📷 Brak pliku:<br/>{cur.img}</div></div>
      ):(<div className="textq">{cur.q}</div>)}
      {cur.hint?<div className="hint">💡 {cur.hint}</div>:null}

      {(mode==='bot'&&active==='p2')?(
        <div className="fb">🤖 Bot myśli...</div>
      ):(<React.Fragment>
        <input className="ans-in" value={ans} placeholder="Wpisz odpowiedź i Enter..." autoFocus
          onChange={e=>setAns(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')submit(ans);}}/>
        <div className="heard">{listening?'🎤 Słucham...':(heard?'Usłyszałem: '+heard:'')}</div>
        <div className="row">
          <button className="btn btn-green" onClick={()=>submit(ans)}>✓ Odpowiedz</button>
          {micOK&&<button className="btn btn-primary" onClick={startMic} disabled={listening}>🎤 Mów</button>}
          <button className="btn btn-amber" onClick={skip}>⏭ Pas −{window.SKIP_PENALTY}s</button>
        </div>
      </React.Fragment>)}
      <div className={"fb "+fb.k}>{fb.t}</div>
    </div>
    <button className="btn" style={{width:'100%'}} onClick={()=>finish(mode==='solo'?'solo':'p1')}>■ Zakończ rundę</button>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
